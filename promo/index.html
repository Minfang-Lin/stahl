<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>宣传片 · 脑内小剧场</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  @font-face { font-family: "ZCOOL KuaiLe"; src: url("../assets/fonts/ZCOOLKuaiLe-Regular.ttf"); }
  html, body { margin: 0; background: #fbeaf1; }
  #pv { display: block; width: 1080px; height: 1440px; }
  /* 小剧场播放器：宣传片从这里借画面，本身不显示 */
  .hidden { position: absolute; left: -99999px; top: 0; width: 1080px; }
</style>
</head>
<body>
<!-- 3:4 竖版宣传片（1080×1440）。在浏览器里打开可以直接预览；导出 MP4：node tools/promo.js -->
<canvas id="pv" width="1080" height="1440"></canvas>

<div class="hidden" aria-hidden="true">
  <header id="epHeader"></header>
  <canvas id="cv"></canvas><i id="prog"></i>
  <ol id="chapters"></ol>
  <h2 id="nTitle"></h2><p id="nText"></p><div id="nFact"></div>
  <button id="prev" type="button"></button><button id="play" type="button"></button><button id="next" type="button"></button>
  <footer id="epFooter"></footer>
</div>

<script src="promo-setup.js"></script>
<script src="../shared/engine.js"></script>
<script src="../synapse/scene.js"></script>
<script src="../antidepressants/scene.js"></script>
<script src="../gaba-system/scene.js"></script>
<script src="../ketamine/scene.js"></script>
<script src="../histamine/scene.js"></script>
<script src="../addiction/scene.js"></script>
<script src="promo.js"></script>
</body>
</html>
